<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="dark"/>
<title>Painel · v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,600;1,700;1,800;1,900&family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Saira+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --red: #E30613;
  --red-soft: #FF3B49;
  --red-deep: #A8030D;
  --bg-0: #0A0A0B;          /* page */
  --bg-1: #131316;          /* cards */
  --bg-2: #1B1C20;          /* elevated cards */
  --bg-3: #25262B;          /* surface-2 */
  --border: rgba(255,255,255,.06);
  --border-strong: rgba(255,255,255,.12);
  --text: #F4F4F2;
  --text-muted: #A8A8A4;
  --text-faint: #6E6F73;
  --success: #34C480;
  --warning: #E0A040;
  --info: #5C8DEF;
  --font-sans: "Inter", system-ui, sans-serif;
  --font-display: "Barlow", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
}
*, *::before, *::after { box-sizing: border-box; }
html, body, #root { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 14px;
  color: var(--text);
  background: var(--bg-0);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 4px; border: 2px solid var(--bg-0); }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.18); }

/* ============== App shell ============== */
.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}
/* The red diagonal wedge from brand graphics — pinned to the right edge */
.app::before {
  content: "";
  position: fixed;
  top: -8%;
  right: -8%;
  width: 28vw;
  height: 120vh;
  background: linear-gradient(180deg, #E30613 0%, #B30410 100%);
  clip-path: polygon(45% 0%, 100% 0%, 100% 100%, 18% 100%);
  z-index: 0;
  pointer-events: none;
  opacity: .88;
}
.app::after {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(800px 500px at 20% 0%, rgba(227,6,19,.10), transparent 60%),
    radial-gradient(700px 400px at 90% 100%, rgba(227,6,19,.08), transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ============== Sidebar ============== */
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  background: linear-gradient(180deg, #0A0A0B 0%, #0E0E10 100%);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 0;
  z-index: 2;
}
.sb-brand {
  padding: 22px 22px 24px;
  border-bottom: 1px solid var(--border);
}
.sb-brand .logo {
  font-family: var(--font-display);
  font-weight: 900;
  font-style: italic;
  font-size: 20px;
  letter-spacing: -.02em;
  line-height: .95;
}
.sb-brand .logo .red { color: var(--red); }
.sb-brand .logo .stack { display: flex; flex-direction: column; }
.sb-brand .logo .stack span:nth-child(2) { padding-left: 6px; }
.sb-brand .tag {
  display: block;
  margin-top: 6px;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: .25em;
  color: var(--text-faint);
  text-transform: uppercase;
}
.sb-brand .tag-it {
  font-family: "Barlow", sans-serif;
  font-style: italic;
  font-size: 10px;
  letter-spacing: .05em;
  color: var(--text-muted);
  text-transform: none;
  margin-top: 2px;
  display: block;
}

.sb-section {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: .22em;
  color: var(--text-faint);
  text-transform: uppercase;
  padding: 18px 22px 8px;
}
.sb-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 22px;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 500;
  position: relative;
  transition: color .12s, background .12s;
}
.sb-item:hover { color: var(--text); background: rgba(255,255,255,.02); }
.sb-item.active {
  color: var(--text);
  background: rgba(227,6,19,.08);
}
.sb-item.active::before {
  content: "";
  position: absolute;
  left: 0; top: 6px; bottom: 6px;
  width: 3px;
  background: var(--red);
}
.sb-item .icn { width: 18px; height: 18px; flex: 0 0 18px; color: var(--red); }
.sb-item:not(.active) .icn { color: var(--text-faint); }
.sb-item:hover:not(.active) .icn { color: var(--red); }
.sb-item .badge {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 1px 6px;
  background: var(--red);
  color: white;
  border-radius: 2px;
  font-weight: 600;
}
.sb-item .badge.dim {
  background: rgba(255,255,255,.06);
  color: var(--text-muted);
}

.sb-foot {
  margin-top: auto;
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.sb-foot .av {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--red), var(--red-deep));
  color: white;
  font-family: var(--font-display);
  font-weight: 800;
  font-style: italic;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.sb-foot .av::after {
  content: "";
  position: absolute;
  bottom: -2px; right: -2px;
  width: 10px; height: 10px;
  background: var(--success);
  border: 2px solid #0E0E10;
  border-radius: 50%;
}
.sb-foot .who { line-height: 1.15; min-width: 0; }
.sb-foot .nm { font-weight: 600; font-size: 13px; }
.sb-foot .role { font-size: 11px; color: var(--text-faint); }
.sb-foot button {
  margin-left: auto;
  background: transparent;
  border: 0;
  color: var(--text-faint);
  cursor: pointer;
  padding: 6px;
  border-radius: 4px;
}
.sb-foot button:hover { color: var(--text); background: rgba(255,255,255,.04); }

/* ============== Main ============== */
.main {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 0 36px 60px;
}

/* Topbar */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 22px 0;
  border-bottom: 1px solid var(--border);
}
.crumbs {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-faint);
  display: flex;
  align-items: center;
  gap: 10px;
}
.crumbs .red-tick {
  width: 6px; height: 6px;
  background: var(--red);
  display: inline-block;
}
.crumbs b { color: var(--text); font-weight: 600; }

.search {
  flex: 1;
  max-width: 440px;
  position: relative;
}
.search svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 15px; height: 15px;
  color: var(--text-faint);
}
.search input {
  width: 100%;
  height: 38px;
  padding: 0 14px 0 38px;
  background: rgba(255,255,255,.03);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 13px;
  outline: none;
  transition: border-color .15s, background .15s;
}
.search input:focus { border-color: var(--red); background: rgba(255,255,255,.05); }
.search .kbd {
  position: absolute;
  right: 10px; top: 50%;
  transform: translateY(-50%);
  display: flex; gap: 3px;
}
.kbd-key {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 2px 6px;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--border-strong);
  color: var(--text-muted);
}

.spacer { flex: 1; }
.tb-actions { display: flex; align-items: center; gap: 8px; }
.icbtn {
  width: 38px; height: 38px;
  background: rgba(255,255,255,.03);
  border: 1px solid var(--border);
  color: var(--text-muted);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: all .12s;
}
.icbtn:hover { border-color: var(--red); color: var(--text); }
.icbtn .ping {
  position: absolute;
  top: 8px; right: 8px;
  width: 7px; height: 7px;
  background: var(--red);
  border-radius: 50%;
  border: 2px solid var(--bg-0);
}
.cta {
  height: 38px;
  padding: 0 18px;
  background: var(--red);
  color: white;
  border: 0;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-display);
  font-style: italic;
  letter-spacing: .01em;
  text-transform: uppercase;
  transition: background .12s;
}
.cta:hover { background: var(--red-soft); }

/* ============== Hero block ============== */
.hero {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 0;
  margin-top: 28px;
  margin-bottom: 28px;
  background: linear-gradient(135deg, #131316 0%, #0F0F11 100%);
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
.hero-left {
  padding: 36px 36px 32px;
  display: flex;
  flex-direction: column;
  position: relative;
}
.hero-eyebrow {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: .25em;
  color: var(--red);
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.hero-eyebrow::before {
  content: "";
  width: 20px; height: 1px;
  background: var(--red);
}
.hero-title {
  font-family: var(--font-display);
  font-weight: 900;
  font-style: italic;
  font-size: 56px;
  line-height: .92;
  letter-spacing: -.025em;
  margin: 0 0 8px;
  text-transform: uppercase;
}
.hero-title .red { color: var(--red); }
.hero-sub {
  color: var(--text-muted);
  font-size: 14.5px;
  line-height: 1.5;
  max-width: 360px;
  margin: 0 0 28px;
}

/* The signature red-icon │ divider │ value spec list */
.spec-list {
  display: grid;
  gap: 14px;
  margin-bottom: auto;
}
.spec-row {
  display: grid;
  grid-template-columns: 26px 1px 1fr;
  gap: 16px;
  align-items: center;
}
.spec-row .ic {
  width: 26px; height: 26px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--red);
}
.spec-row .ic svg { width: 22px; height: 22px; }
.spec-row .sep {
  background: var(--red);
  width: 1.5px;
  height: 26px;
  justify-self: center;
}
.spec-row .val {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 17px;
  letter-spacing: .005em;
  color: var(--text);
}
.spec-row .val small {
  display: block;
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 400;
  font-family: var(--font-sans);
  letter-spacing: 0;
  margin-top: 2px;
}

.hero-actions {
  display: flex;
  gap: 10px;
  margin-top: 28px;
}
.btn-pri {
  padding: 11px 18px;
  background: var(--red);
  color: white;
  border: 0;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: .1em;
  text-transform: uppercase;
  cursor: pointer;
  font-family: var(--font-display);
  font-style: italic;
  transition: background .12s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn-pri:hover { background: var(--red-soft); }
.btn-out {
  padding: 11px 18px;
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border-strong);
  font-weight: 600;
  font-size: 12px;
  letter-spacing: .1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color .12s;
  font-family: var(--font-display);
  font-style: italic;
}
.btn-out:hover { border-color: var(--red); }

.hero-right {
  position: relative;
  background: linear-gradient(135deg, #1A1A1D 0%, #0A0A0B 100%);
  overflow: hidden;
  min-height: 460px;
}
.hero-right::before {
  content: "";
  position: absolute;
  top: -10%;
  right: -15%;
  width: 50%;
  height: 130%;
  background: linear-gradient(135deg, var(--red) 0%, var(--red-deep) 100%);
  clip-path: polygon(35% 0%, 100% 0%, 100% 100%, 5% 100%);
  opacity: .92;
}
.hero-right::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(600px 380px at 30% 70%, rgba(227,6,19,.18), transparent 60%),
    repeating-linear-gradient(90deg, transparent 0 60px, rgba(255,255,255,.015) 60px 61px);
}
.hero-right .car {
  position: absolute;
  bottom: 8%;
  left: 4%;
  right: 8%;
  z-index: 1;
}
.hero-right .car svg { width: 100%; height: auto; filter: drop-shadow(0 30px 40px rgba(0,0,0,.6)); }
.hero-tag {
  position: absolute;
  top: 24px; left: 24px;
  z-index: 2;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .25em;
  color: rgba(255,255,255,.45);
  text-transform: uppercase;
  display: flex; align-items: center; gap: 8px;
}
.hero-tag .dot { width: 6px; height: 6px; background: white; border-radius: 50%; }
.hero-plate {
  position: absolute;
  bottom: 24px; left: 24px;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  background: rgba(0,0,0,.5);
  border: 1px solid rgba(255,255,255,.15);
  padding: 4px 10px 4px 6px;
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: .15em;
  color: white;
}
.hero-plate::before {
  content: "PT";
  background: var(--info);
  color: white;
  font-size: 9px;
  padding: 4px 5px;
  margin-right: 8px;
  letter-spacing: .1em;
  font-weight: 700;
}
.hero-stats {
  position: absolute;
  top: 24px; right: 24px;
  z-index: 2;
  display: flex;
  gap: 0;
}
.hero-stat {
  text-align: right;
  padding: 0 18px;
  border-right: 1px solid rgba(255,255,255,.18);
}
.hero-stat:last-child { border-right: 0; padding-right: 0; }
.hero-stat .n {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 800;
  font-size: 22px;
  letter-spacing: -.01em;
  color: white;
  line-height: 1;
}
.hero-stat .l {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: .2em;
  color: rgba(255,255,255,.65);
  text-transform: uppercase;
  margin-top: 5px;
}

/* ============== Value props strip (from social media) ============== */
.values-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  background: linear-gradient(180deg, #0E0E10 0%, #131316 100%);
  border: 1px solid var(--border);
  border-top: 0;
  margin-top: -28px;
  margin-bottom: 36px;
  position: relative;
  z-index: 1;
}
.value-cell {
  display: grid;
  grid-template-columns: 32px 1fr;
  gap: 14px;
  align-items: center;
  padding: 18px 24px;
  border-right: 1px solid var(--border);
}
.value-cell:last-child { border-right: 0; }
.value-cell .check {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--red);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: white;
}
.value-cell .lbl {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 14px;
  line-height: 1.25;
  letter-spacing: -.005em;
}
.value-cell .lbl small {
  display: block;
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: .15em;
  color: var(--text-faint);
  font-weight: 400;
  text-transform: uppercase;
  margin-bottom: 4px;
}

/* ============== KPIs ============== */
.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 16px;
}
.gc-3 { grid-column: span 3; }
.gc-4 { grid-column: span 4; }
.gc-5 { grid-column: span 5; }
.gc-6 { grid-column: span 6; }
.gc-7 { grid-column: span 7; }
.gc-8 { grid-column: span 8; }
.gc-12 { grid-column: span 12; }
@media (max-width: 1280px) {
  .gc-3, .gc-4, .gc-5, .gc-7, .gc-8 { grid-column: span 6; }
}

.kpi {
  background: linear-gradient(180deg, #131316 0%, #101012 100%);
  border: 1px solid var(--border);
  padding: 20px 22px;
  position: relative;
  overflow: hidden;
}
.kpi::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--red);
  opacity: 0;
  transition: opacity .15s;
}
.kpi:hover::before { opacity: 1; }
.kpi-row {
  display: grid;
  grid-template-columns: 26px 1px 1fr auto;
  gap: 14px;
  align-items: center;
  margin-bottom: 16px;
}
.kpi-row .ic { color: var(--red); width: 22px; height: 22px; }
.kpi-row .sep { background: var(--red); width: 1.5px; height: 26px; }
.kpi-row .lbl {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .18em;
  color: var(--text-muted);
  text-transform: uppercase;
}
.kpi .v {
  font-family: var(--font-display);
  font-weight: 800;
  font-style: italic;
  font-size: 38px;
  line-height: .95;
  letter-spacing: -.025em;
}
.kpi .v small {
  font-family: var(--font-sans);
  font-style: normal;
  font-weight: 500;
  font-size: 14px;
  color: var(--text-muted);
  margin-left: 4px;
  letter-spacing: 0;
}
.kpi .delta {
  margin-top: 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.kpi .delta.up { color: var(--success); }
.kpi .delta.down { color: var(--red-soft); }
.kpi .delta .vs { color: var(--text-faint); margin-left: 6px; }
.kpi .spark {
  position: absolute;
  right: 0; bottom: 0;
  width: 50%; height: 36px;
  opacity: .6;
}

/* ============== Panels ============== */
.panel {
  background: linear-gradient(180deg, #131316 0%, #101012 100%);
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
.panel-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--border);
}
.panel-hd .ttl {
  display: flex;
  align-items: center;
  gap: 12px;
}
.panel-hd .ttl .ic {
  color: var(--red);
  width: 18px; height: 18px;
}
.panel-hd .ttl .sep {
  background: var(--red);
  width: 1.5px;
  height: 22px;
}
.panel-hd .ttl h3 {
  font-family: var(--font-display);
  font-weight: 700;
  font-style: italic;
  font-size: 18px;
  letter-spacing: -.01em;
  margin: 0;
  text-transform: uppercase;
}
.panel-hd .sub {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .15em;
  color: var(--text-faint);
  text-transform: uppercase;
}
.panel-hd .actions { display: flex; gap: 8px; align-items: center; }
.panel-bd { padding: 22px; }
.panel-bd.flush { padding: 0; }

.chip-grp {
  display: inline-flex;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  padding: 3px;
}
.chip-grp button {
  background: transparent;
  border: 0;
  padding: 4px 12px;
  color: var(--text-muted);
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.chip-grp button.on {
  background: var(--red);
  color: white;
}

/* Sales chart */
.chart-totals { display: flex; gap: 28px; margin-bottom: 14px; }
.chart-totals .num {
  font-family: var(--font-display);
  font-weight: 800;
  font-style: italic;
  font-size: 26px;
  letter-spacing: -.02em;
  line-height: 1;
}
.chart-totals .lbl {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .15em;
  color: var(--text-faint);
  text-transform: uppercase;
  margin-top: 6px;
}

/* AI Leads */
.ai-row {
  display: grid;
  grid-template-columns: 40px 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 12px 22px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .12s;
}
.ai-row:hover { background: rgba(227,6,19,.04); }
.ai-row:last-child { border-bottom: 0; }
.ai-score {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: conic-gradient(from -90deg, var(--red) var(--p), rgba(255,255,255,.08) var(--p));
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.ai-score::after {
  content: "";
  position: absolute;
  inset: 3px;
  background: #131316;
  border-radius: 50%;
}
.ai-score span {
  position: relative;
  z-index: 1;
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 12px;
  color: white;
}
.ai-row .nm { font-weight: 600; font-size: 13.5px; }
.ai-row .det {
  color: var(--text-faint);
  font-size: 11.5px;
  margin-top: 2px;
  font-family: var(--font-mono);
}
.ai-row .arr { color: var(--red); width: 16px; height: 16px; }

.panel-ft {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 22px;
  border-top: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .12em;
  color: var(--text-faint);
  text-transform: uppercase;
}
.panel-ft a {
  color: var(--red);
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* Schedule */
.sch-row {
  display: grid;
  grid-template-columns: 60px 1px 1fr auto;
  gap: 16px;
  align-items: center;
  padding: 14px 22px;
  border-bottom: 1px solid var(--border);
}
.sch-row:last-child { border-bottom: 0; }
.sch-row .h {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 800;
  font-size: 22px;
  color: var(--red);
  letter-spacing: -.01em;
  line-height: 1;
  text-align: right;
}
.sch-row .h small {
  display: block;
  font-family: var(--font-mono);
  font-style: normal;
  font-weight: 400;
  font-size: 9px;
  letter-spacing: .2em;
  color: var(--text-faint);
  margin-top: 4px;
  text-transform: uppercase;
}
.sch-row .sep { background: var(--red); width: 1.5px; height: 32px; justify-self: center; }
.sch-row .body .who { font-weight: 600; font-size: 14px; }
.sch-row .body .what { color: var(--text-muted); font-size: 12px; margin-top: 3px; }
.sch-row .tag {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: .15em;
  padding: 4px 8px;
  border: 1px solid var(--border-strong);
  color: var(--text-muted);
  text-transform: uppercase;
  font-weight: 600;
}
.sch-row .tag.red { color: var(--red); border-color: var(--red); }
.sch-row .tag.gold { color: var(--warning); border-color: rgba(224,160,64,.4); }
.sch-row .tag.blue { color: var(--info); border-color: rgba(92,141,239,.4); }
.sch-row .tag.green { color: var(--success); border-color: rgba(52,196,128,.4); }

/* Pipeline */
.pipe {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}
.pipe-col { border-right: 1px solid var(--border); min-height: 280px; }
.pipe-col:last-child { border-right: 0; }
.pipe-h {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.pipe-h .nm {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--text);
  font-weight: 600;
}
.pipe-h .nm .dot { width: 7px; height: 7px; border-radius: 50%; }
.pipe-h .ct {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 2px 7px;
  background: rgba(255,255,255,.06);
  color: var(--text-muted);
}
.pipe-b { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.deal {
  background: rgba(255,255,255,.025);
  border: 1px solid var(--border);
  padding: 12px;
  cursor: grab;
  transition: border-color .12s, transform .12s;
}
.deal:hover { border-color: var(--red); transform: translateY(-1px); }
.deal .car {
  font-family: var(--font-display);
  font-weight: 600;
  font-style: italic;
  font-size: 14px;
  letter-spacing: -.005em;
}
.deal .meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  font-family: var(--font-mono);
  font-size: 11px;
}
.deal .price { color: var(--red); font-weight: 700; }
.deal .who { color: var(--text-faint); display: inline-flex; align-items: center; gap: 6px; }
.deal .who .av {
  width: 18px; height: 18px; border-radius: 50%;
  background: linear-gradient(135deg, #2C2D31, #4A4D54);
  color: white;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px;
  font-weight: 700;
  font-family: var(--font-sans);
}

/* Inventory table */
.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.tbl th, .tbl td {
  text-align: left;
  padding: 13px 18px;
  border-bottom: 1px solid var(--border);
}
.tbl th {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .12em;
  color: var(--text-faint);
  text-transform: uppercase;
  background: rgba(255,255,255,.02);
}
.tbl tbody tr { transition: background .1s; cursor: pointer; }
.tbl tbody tr:hover { background: rgba(227,6,19,.05); }
.tbl .nm-cell { display: flex; align-items: center; gap: 12px; }
.tbl .thumb {
  width: 44px; height: 32px;
  background: linear-gradient(135deg, rgba(255,255,255,.05), rgba(0,0,0,.4));
  border: 1px solid var(--border);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--red);
}
.tbl .nm-cell .nm { font-family: var(--font-display); font-weight: 600; font-size: 14px; }
.tbl .nm-cell .vin { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); letter-spacing: .04em; margin-top: 2px; }
.tbl .num { font-family: var(--font-mono); }
.tbl .price { color: var(--red); font-weight: 700; }
.tbl .badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .12em;
  padding: 3px 8px;
  border: 1px solid var(--border-strong);
  color: var(--text-muted);
  text-transform: uppercase;
  font-weight: 600;
}
.tbl .badge .d { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.tbl .badge.green { color: var(--success); border-color: rgba(52,196,128,.4); }
.tbl .badge.gold { color: var(--warning); border-color: rgba(224,160,64,.4); }
.tbl .badge.blue { color: var(--info); border-color: rgba(92,141,239,.4); }
.tbl .badge.red { color: var(--red); border-color: rgba(227,6,19,.5); }

/* Tiny utility */
.flex { display: flex; }
.mt-1 { margin-top: 16px; }
.mt-2 { margin-top: 28px; }

/* Page head */
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 24px;
  margin-top: 28px;
}
.page-head h1 {
  font-family: var(--font-display);
  font-weight: 900;
  font-style: italic;
  font-size: 38px;
  letter-spacing: -.025em;
  margin: 0 0 4px;
  line-height: 1;
  text-transform: uppercase;
}
.page-head h1 em { color: var(--red); font-style: italic; }
.page-head .sub-info {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--text-faint);
  text-transform: uppercase;
  margin-top: 8px;
}
.page-head .sub-info .red { color: var(--red); }
.page-head-actions { display: flex; gap: 8px; }

/* ============================================
   TWEAKS — runtime knobs
   ============================================ */
:root { --r-scale: 0.5; --wedge-opacity: .88; }

/* Font presets */
[data-font="barlow"]    { --font-display: "Barlow", system-ui, sans-serif;          --font-sans: "Inter", system-ui, sans-serif; }
[data-font="oswald"]    { --font-display: "Oswald", system-ui, sans-serif;          --font-sans: "DM Sans", system-ui, sans-serif; }
[data-font="bebas"]     { --font-display: "Bebas Neue", system-ui, sans-serif;      --font-sans: "Manrope", system-ui, sans-serif; }
[data-font="saira"]     { --font-display: "Saira Condensed", system-ui, sans-serif; --font-sans: "IBM Plex Sans", system-ui, sans-serif; }
[data-font="editorial"] { --font-display: "Playfair Display", Georgia, serif;       --font-sans: "Inter", system-ui, sans-serif; }

/* Single-weight display fonts: don't try to bold them */
[data-font="bebas"] .hero-title,
[data-font="bebas"] .page-head h1,
[data-font="bebas"] .kpi .v,
[data-font="bebas"] .panel-hd .ttl h3,
[data-font="bebas"] .deal .car,
[data-font="bebas"] .tbl .nm-cell .nm,
[data-font="bebas"] .sch-row .h,
[data-font="bebas"] .btn-pri,
[data-font="bebas"] .cta { font-weight: 400; letter-spacing: .01em; }

[data-font="editorial"] .hero-title,
[data-font="editorial"] .page-head h1 { font-weight: 500; }

/* Radius scale (v2 is sharp by default; tweak lifts it) */
.kpi, .panel, .deal, .hero, .pipe-card, .tbl, .hero-right { border-radius: calc(3px * var(--r-scale, 0)); }
.btn-pri, .btn-out, .cta, .icbtn { border-radius: calc(2px * var(--r-scale, 0)); }

/* Density */
[data-density="compact"] .panel-bd { padding: 14px; }
[data-density="compact"] .panel-hd { padding: 12px 16px 10px; }
[data-density="compact"] .kpi { padding: 14px 16px; }
[data-density="compact"] .hero-left { padding: 24px 24px 22px; }
[data-density="compact"] .main { padding: 0 22px 40px; }
[data-density="comfy"] .panel-bd { padding: 30px; }
[data-density="comfy"] .panel-hd { padding: 22px 28px 18px; }
[data-density="comfy"] .kpi { padding: 26px 28px; }
[data-density="comfy"] .hero-left { padding: 44px 44px 40px; }
[data-density="comfy"] .main { padding: 0 48px 80px; }

/* Border emphasis */
[data-border="hairline"] { --border: rgba(255,255,255,.03); --border-strong: rgba(255,255,255,.07); }
[data-border="crisp"]    { --border: rgba(255,255,255,.12); --border-strong: rgba(255,255,255,.22); }

/* Accent style */
[data-accent="outline"] .btn-pri,
[data-accent="outline"] .cta {
  background: transparent;
  color: var(--red);
  border: 1px solid var(--red);
}
[data-accent="outline"] .btn-pri:hover,
[data-accent="outline"] .cta:hover {
  background: rgba(227,6,19,.08);
}
[data-accent="muted"] .btn-pri,
[data-accent="muted"] .cta {
  background: #1F2024;
  color: white;
  border: 1px solid rgba(255,255,255,.14);
}
[data-accent="muted"] .btn-pri:hover,
[data-accent="muted"] .cta:hover {
  background: #2A2B2F;
}

/* Uppercase labels */
[data-upper="0"] .hero-eyebrow,
[data-upper="0"] .crumbs,
[data-upper="0"] .sb-section,
[data-upper="0"] .kpi-row .lbl,
[data-upper="0"] .hero-stat .l,
[data-upper="0"] .panel-hd .ttl h3,
[data-upper="0"] .panel-hd .sub,
[data-upper="0"] .chart-totals .lbl,
[data-upper="0"] .chip-grp button,
[data-upper="0"] .page-head h1,
[data-upper="0"] .hero-title,
[data-upper="0"] .tbl th,
[data-upper="0"] .pipe-h .nm,
[data-upper="0"] .tbl .badge,
[data-upper="0"] .sch-row .tag,
[data-upper="0"] .sb-brand .tag,
[data-upper="0"] .hero-tag,
[data-upper="0"] .page-head .sub-info {
  text-transform: none;
  letter-spacing: 0;
}

/* Mono numerics */
[data-mono-num="1"] .kpi .v,
[data-mono-num="1"] .chart-totals .num,
[data-mono-num="1"] .tbl .price,
[data-mono-num="1"] .hero-stat .n,
[data-mono-num="1"] .deal .price {
  font-family: var(--font-mono);
  font-style: normal;
  font-feature-settings: "tnum" 1;
  letter-spacing: -.01em;
}

/* Italic headlines */
[data-italic-h="0"] .hero-title,
[data-italic-h="0"] .panel-hd .ttl h3,
[data-italic-h="0"] .kpi .v,
[data-italic-h="0"] .page-head h1,
[data-italic-h="0"] .btn-pri,
[data-italic-h="0"] .cta,
[data-italic-h="0"] .deal .car,
[data-italic-h="0"] .tbl .nm-cell .nm,
[data-italic-h="0"] .sch-row .h,
[data-italic-h="0"] .hero-stat .n,
[data-italic-h="0"] .sb-brand .logo {
  font-style: normal;
}

/* Gradient mode */
[data-gradient="off"] .kpi,
[data-gradient="off"] .panel { background: var(--bg-1); }
[data-gradient="off"] .hero { background: var(--bg-1); }
[data-gradient="off"] .hero-right { background: linear-gradient(135deg, #161618 0%, #0C0C0E 100%); }
[data-gradient="off"] .app::after { display: none; }
[data-gradient="off"] .values-strip { background: var(--bg-1); }

[data-gradient="rich"] .app::after {
  background:
    radial-gradient(1000px 700px at 15% 0%, rgba(227,6,19,.18), transparent 60%),
    radial-gradient(900px 600px at 90% 100%, rgba(227,6,19,.14), transparent 70%) !important;
  opacity: 1 !important;
}

/* Wedge intensity + position */
.app::before { opacity: var(--wedge-opacity, .88); }

[data-wedge="off"] .app::before { display: none; }
[data-wedge="edge"] .app::before {
  top: 0;
  right: 0;
  bottom: 0;
  width: 12px;
  height: 100vh;
  clip-path: none;
  background: linear-gradient(180deg, #E30613 0%, #B30410 100%);
  position: fixed;
}
[data-wedge="header"] .app::before {
  position: absolute;
  top: 0;
  right: 0;
  width: 38%;
  height: 380px;
  clip-path: polygon(35% 0%, 100% 0%, 100% 100%, 62% 100%);
  background: linear-gradient(180deg, #E30613 0%, #B30410 100%);
}

/* ============================================
   LIGHT THEME
   ============================================ */
[data-theme="light"] {
  color-scheme: light;
  --bg-0: #F4F2EE;
  --bg-1: #FFFFFF;
  --bg-2: #FAF8F2;
  --bg-3: #EEEBE3;
  --border: rgba(15,15,17,.08);
  --border-strong: rgba(15,15,17,.18);
  --text: #0F0F11;
  --text-muted: #5A5C61;
  --text-faint: #8A8C92;
}

/* Sidebar */
[data-theme="light"] .sidebar {
  background: linear-gradient(180deg, #FFFFFF 0%, #FAF8F2 100%);
  border-right: 1px solid var(--border);
}
[data-theme="light"] .sb-brand,
[data-theme="light"] .sb-foot { border-color: var(--border); }
[data-theme="light"] .sb-foot button:hover { background: rgba(15,15,17,.05); color: var(--text); }
[data-theme="light"] .sb-foot .av::after { border-color: #FFFFFF; }
[data-theme="light"] .sb-item:hover { background: rgba(15,15,17,.04); color: var(--text); }
[data-theme="light"] .sb-item.active { background: rgba(227,6,19,.08); color: var(--text); }
[data-theme="light"] .sb-item:not(.active) .icn { color: var(--text-faint); }
[data-theme="light"] .sb-item .badge.dim { background: rgba(15,15,17,.06); color: var(--text-muted); }
[data-theme="light"] .sb-section { color: var(--text-faint); }
[data-theme="light"] .sb-foot .role { color: var(--text-faint); }
[data-theme="light"] .sb-brand .tag { color: var(--text-faint); }
[data-theme="light"] .sb-brand .tag-it { color: var(--text-muted); }

/* Topbar elements */
[data-theme="light"] .search input {
  background: rgba(15,15,17,.03);
  border-color: rgba(15,15,17,.10);
  color: var(--text);
}
[data-theme="light"] .search input::placeholder { color: var(--text-faint); }
[data-theme="light"] .search input:focus {
  background: rgba(15,15,17,.05);
  border-color: var(--red);
}
[data-theme="light"] .kbd-key {
  background: rgba(15,15,17,.05);
  border-color: rgba(15,15,17,.10);
  color: var(--text-muted);
}
[data-theme="light"] .icbtn {
  background: rgba(15,15,17,.03);
  border-color: rgba(15,15,17,.10);
  color: var(--text-muted);
}
[data-theme="light"] .icbtn:hover {
  background: rgba(15,15,17,.06);
  color: var(--text);
  border-color: var(--red);
}
[data-theme="light"] .icbtn .ping { border-color: var(--bg-0); }
[data-theme="light"] .crumbs b { color: var(--text); }

/* Hero (left side becomes light; right side stays dark for drama) */
[data-theme="light"] .hero {
  background: linear-gradient(135deg, #FFFFFF 0%, #FAF8F2 100%);
  border-color: var(--border);
}
[data-theme="light"] .hero-sub { color: var(--text-muted); }
[data-theme="light"] .hero-sub strong { color: var(--text); }
[data-theme="light"] .spec-row .val { color: var(--text); }
[data-theme="light"] .spec-row .val small { color: var(--text-muted); }
[data-theme="light"] .btn-out { border-color: var(--border-strong); color: var(--text); }
[data-theme="light"] .btn-out:hover { border-color: var(--red); }

/* Values strip */
[data-theme="light"] .values-strip {
  background: linear-gradient(180deg, #FFFFFF 0%, #FAF8F2 100%);
  border-color: var(--border);
}
[data-theme="light"] .value-cell { border-right-color: var(--border); }

/* KPI cards */
[data-theme="light"] .kpi {
  background: linear-gradient(180deg, #FFFFFF 0%, #FAF8F2 100%);
  border-color: var(--border);
}
[data-theme="light"] .kpi-row .lbl { color: var(--text-muted); }

/* Panel base */
[data-theme="light"] .panel {
  background: linear-gradient(180deg, #FFFFFF 0%, #FAF8F2 100%);
  border-color: var(--border);
}
[data-theme="light"] .panel-hd { border-bottom-color: var(--border); }
[data-theme="light"] .panel-ft { border-top-color: var(--border); color: var(--text-faint); }
[data-theme="light"] .chip-grp {
  background: rgba(15,15,17,.04);
  border-color: var(--border);
}
[data-theme="light"] .chip-grp button { color: var(--text-muted); }
[data-theme="light"] .panel-hd .sub { color: var(--text-faint); }

/* AI panel — keep dark for high contrast */
[data-theme="light"] .ai-row { border-bottom-color: rgba(255,255,255,.05); }
[data-theme="light"] .ai-score::after { background: #131316; }

/* Pipeline */
[data-theme="light"] .pipe-col { background: var(--bg-1); border-right-color: var(--border); }
[data-theme="light"] .pipe-h { border-bottom-color: var(--border); }
[data-theme="light"] .pipe-h .ct {
  background: rgba(15,15,17,.06);
  color: var(--text-muted);
}
[data-theme="light"] .deal {
  background: #FFFFFF;
  border-color: var(--border);
}
[data-theme="light"] .deal:hover { border-color: var(--red); }
[data-theme="light"] .deal .who .av {
  background: linear-gradient(135deg, #6E6F73, #2C2D31);
  color: white;
}

/* Schedule */
[data-theme="light"] .sch-row { border-bottom-color: var(--border); }
[data-theme="light"] .sch-row .h small { color: var(--text-faint); }
[data-theme="light"] .sch-row .body .what { color: var(--text-muted); }
[data-theme="light"] .sch-row .tag { border-color: var(--border-strong); color: var(--text-muted); }

/* Table */
[data-theme="light"] .tbl th {
  background: rgba(15,15,17,.03);
  color: var(--text-faint);
}
[data-theme="light"] .tbl th,
[data-theme="light"] .tbl td { border-bottom-color: var(--border); }
[data-theme="light"] .tbl tbody tr:hover { background: rgba(227,6,19,.04); }
[data-theme="light"] .tbl .thumb {
  background: linear-gradient(135deg, #FAF8F2, #EEEBE3);
  border-color: var(--border);
}
[data-theme="light"] .tbl .nm-cell .vin { color: var(--text-faint); }
[data-theme="light"] .tbl .badge { border-color: var(--border-strong); color: var(--text-muted); }

/* Page head */
[data-theme="light"] .page-head .sub-info { color: var(--text-faint); }

/* Ambient app::after — softer in light */
[data-theme="light"] .app::after {
  background:
    radial-gradient(800px 500px at 20% 0%, rgba(227,6,19,.04), transparent 60%),
    radial-gradient(700px 400px at 90% 100%, rgba(227,6,19,.03), transparent 70%);
}

/* Scrollbar */
[data-theme="light"] ::-webkit-scrollbar-thumb { background: rgba(15,15,17,.10); border-color: var(--bg-0); }

// KPI
const Spark = ({d, color="#E30613"}) => {
  const w=120, h=36, pad=2;
  const max=Math.max(...d), min=Math.min(...d), r=max-min||1;
  const sx=(w-pad*2)/(d.length-1);
  const pts = d.map((v,i)=>[pad+i*sx, h-pad-((v-min)/r)*(h-pad*2)]);
  const path = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area = path+` L${(w-pad).toFixed(1)} ${h-pad} L${pad} ${h-pad} Z`;
  return <svg className="spark" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
    <path d={area} fill={color} opacity=".15"/>
    <path d={path} fill="none" stroke={color} strokeWidth="1.5"/>
  </svg>;
};
const KPI = ({Icn, label, v, unit, prefix, delta, spark}) => (
  <div className="kpi">

      <div className="lbl">{label}</div>

    <div className={`delta ${delta>=0?"up":"down"}`}>

      {Math.abs(delta)}%

// Sales chart
const SalesChart = () => {
  const months = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const sold = [22,28,24,31,27,33,29,35,30,38,42,36];
  const target = [25,25,28,28,30,30,32,32,34,34,36,36];
  const w=720, h=200, pL=36, pR=14, pT=10, pB=26, max=50;
  const sX=(w-pL-pR)/(months.length-1);
  const yF=v=>pT+(1-v/max)*(h-pT-pB);
  const linePath = arr => arr.map((v,i)=>(i?"L":"M")+(pL+i*sX).toFixed(1)+" "+yF(v).toFixed(1)).join(" ");
  const area = linePath(sold)+` L${(pL+(sold.length-1)*sX).toFixed(1)} ${h-pB} L${pL} ${h-pB} Z`;

            <div className="lbl">Faturação</div>
          </div>
          <div>
            <div className="num">14.2<span style={{fontSize:14, color:"var(--text-muted)", fontFamily:"var(--font-sans)", fontStyle:"normal"}}>%</span></div>
            <div className="lbl">Margem Média</div>
          </div>
        </div>
        <svg viewBox={`0 0 ${w} ${h}`} width="100%" height="220" preserveAspectRatio="none">
          <defs>
            <linearGradient id="sg" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stopColor="#E30613" stopOpacity=".4"/>
              <stop offset="100%" stopColor="#E30613" stopOpacity="0"/>
            </linearGradient>
          </defs>
          {[0,10,20,30,40,50].map(v=>(
            <g key={v}>
              <line x1={pL} x2={w-pR} y1={yF(v)} y2={yF(v)} stroke="rgba(255,255,255,.05)" strokeDasharray="2 4"/>

            </g>
          ))}
          <path d={linePath(target)} fill="none" stroke="rgba(255,255,255,.25)" strokeWidth="1.5" strokeDasharray="4 4"/>
          <path d={area} fill="url(#sg)"/>
          <path d={linePath(sold)} fill="none" stroke="var(--red)" strokeWidth="2.2"/>
          {sold.map((v,i)=>(
            <circle key={i} cx={pL+i*sX} cy={yF(v)} r={i===sold.length-1?5:3}

// Final design tokens — baked from the tweaks panel used during design iteration.
const DESIGN_TOKENS = {
  fontPreset: "barlow",
  radiusScale: 2.2,
  accentStyle: "solid",
  density: "compact",
  borderEmphasis: "crisp",
  uppercaseLabels: true,
  monoNumerics: true,
  wedgePosition: "edge",
  wedgeIntensity: 0.8,
  italicHeadlines: true,
  gradientMode: "soft",
};

const App = () => {
  const [page, setPage] = React.useState("dashboard");
  const [theme, setTheme] = React.useState(() => localStorage.getItem("painel-theme") || "dark");

  React.useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("painel-theme", theme);
  }, [theme]);

  React.useEffect(() => {
    const r = document.documentElement;
    const t = DESIGN_TOKENS;
    r.style.setProperty("--r-scale", t.radiusScale);
    r.style.setProperty("--wedge-opacity", t.wedgeIntensity);
    r.setAttribute("data-font", t.fontPreset);
    r.setAttribute("data-density", t.density);
    r.setAttribute("data-border", t.borderEmphasis);
    r.setAttribute("data-accent", t.accentStyle);
    r.setAttribute("data-upper", t.uppercaseLabels ? "1" : "0");
    r.setAttribute("data-mono-num", t.monoNumerics ? "1" : "0");
    r.setAttribute("data-italic-h", t.italicHeadlines ? "1" : "0");
    r.setAttribute("data-gradient", t.gradientMode);
    r.setAttribute("data-wedge", t.wedgePosition);
  }, []);

  return (
    <div className="app">
      <Sidebar page={page} setPage={setPage}/>
      <main className="main"><Dashboard theme={theme} setTheme={setTheme}/></main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
